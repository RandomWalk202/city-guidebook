<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>昆明路书</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #f3f0e8;
      --ink: #1c2421;
      --muted: #5c6b64;
      --card: #fffcf6;
      --line: #d9d2c4;
      --accent: #0f6b5c;
      --accent-soft: #d8efe8;
      --warm: #c45c26;
      --rain: #3d6f8c;
      --shadow: 0 10px 30px rgba(28, 36, 33, 0.08);
      --radius: 16px;
      --font: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #e7f3ef 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #f7e8dc 0%, transparent 50%),
        var(--bg);
      min-height: 100vh;
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }
    header {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }
    .crumb {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .crumb a {
      color: var(--accent);
      text-decoration: none;
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    .crumb a:hover { opacity: 0.75; }
    .crumb .sep {
      color: var(--line);
      font-size: 12px;
    }
    .crumb .here {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.16em;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
    }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(30px, 4vw, 42px);
      line-height: 1.15;
      letter-spacing: 0.02em;
    }
    .layout {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 16px;
      margin-top: 14px;
    }
    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card-head {
      padding: 14px 16px 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      border-bottom: 1px solid var(--line);
      background: #fffcf6;
    }
    .card-head h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: -0.01em;
    }
    .card-head .meta {
      color: var(--muted);
      font-size: 12px;
    }
    .map-shell {
      position: relative;
      background: transparent;
    }
    #map {
      height: calc(100vh - 240px);
      min-height: 520px;
      width: 100%;
      background: transparent;
    }
    .leaflet-container {
      font-family: var(--font);
      background: transparent !important;
    }
    .leaflet-div-icon {
      background: transparent !important;
      border: none !important;
    }
    /* 底图半透明叠在页面底色上，避免发灰发白 */
    .leaflet-tile-pane {
      opacity: 0.38;
    }
    .leaflet-control-attribution {
      background: transparent !important;
      box-shadow: none !important;
      color: var(--muted) !important;
    }
    .leaflet-control-zoom a {
      color: var(--ink) !important;
    }
    .leaflet-popup-content-wrapper {
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(28,36,33,0.12);
      border: 1px solid var(--line);
    }
    .leaflet-popup-content {
      margin: 10px 12px;
      font-family: var(--font);
      line-height: 1.45;
      min-width: 140px;
    }
    .leaflet-popup-tip {
      box-shadow: none;
    }
    .mk-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      filter: drop-shadow(0 4px 10px rgba(28,36,33,0.22));
    }
    .mk {
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: 2.5px solid #fff;
      box-shadow: 0 0 0 2px rgba(15,107,92,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .mk.hotel { background: #9a5b2f; box-shadow: 0 0 0 2px rgba(154,91,47,0.2); }
    .mk.transit { background: #3d6f8c; box-shadow: 0 0 0 2px rgba(61,111,140,0.2); }
    .mk.food { background: #c45c26; box-shadow: 0 0 0 2px rgba(196,92,38,0.2); }
    .mk-name {
      background: #fffcf6;
      border: 1px solid rgba(28,36,33,0.12);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
      padding: 5px 9px;
      border-radius: 8px;
      white-space: nowrap;
    }
    .route-label {
      background: #fffcf6;
      border: 1px solid rgba(15,107,92,0.28);
      color: #0f6b5c;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 3px 10px rgba(28,36,33,0.14);
      pointer-events: none;
    }
    .popup-time {
      color: var(--warm);
      font-size: 12px;
      font-weight: 650;
      margin-bottom: 2px;
      font-variant-numeric: tabular-nums;
    }
    .popup-title {
      font-weight: 700;
      font-size: 14px;
    }
    .popup-desc {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }
    .legend {
      padding: 10px 16px 12px;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      background: #fffcf6;
    }
    .list-card {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .timeline {
      padding: 8px 8px 16px;
      max-height: calc(100vh - 220px);
      min-height: 520px;
      overflow: auto;
      flex: 1;
    }
    .stop {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 10px;
      padding: 12px;
      border-radius: 12px;
      margin: 6px 8px;
    }
    .stop:hover, .stop.active {
      background: var(--accent-soft);
    }
    .time {
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: var(--warm);
      font-weight: 700;
      padding-top: 2px;
    }
    .stop h3 {
      margin: 0 0 4px;
      font-size: 15px;
    }
    .stop p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .transit {
      margin: 0 18px;
      padding: 6px 10px 6px 82px;
      font-size: 12px;
      color: var(--rain);
      border-left: 2px dashed #b7c9c2;
      position: relative;
      line-height: 1.45;
    }
    .transit .via {
      color: var(--muted);
      margin-left: 6px;
    }
    .mk.via-pt {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      font-size: 0;
      background: #7a8f87;
      border-width: 2px;
      box-shadow: 0 0 0 1.5px rgba(122, 143, 135, 0.25);
    }
    .card-head .head-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: #fffcf6;
      color: var(--ink);
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      line-height: 1.2;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn.danger {
      color: #9a3b2f;
      border-color: #e2c4be;
    }
    .btn.tiny {
      padding: 4px 7px;
      font-size: 11px;
    }
    .edit-banner {
      display: none;
      margin: 0;
      padding: 8px 12px;
      font-size: 12px;
      color: var(--accent);
      background: var(--accent-soft);
      border-bottom: 1px solid #cfe4dc;
    }
    body.editing .edit-banner { display: block; }
    body.editing .map-card .legend {
      display: block;
      color: var(--accent);
    }
    .stop-edit {
      display: grid;
      gap: 6px;
    }
    .stop-edit .row {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 8px;
      align-items: start;
    }
    .field {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 7px 9px;
      font: inherit;
      font-size: 13px;
      color: var(--ink);
    }
    .field:focus {
      outline: 2px solid rgba(15, 107, 92, 0.22);
      border-color: var(--accent);
    }
    .field.time { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--warm); }
    .field.name { font-weight: 700; font-size: 14px; }
    .field.desc { color: var(--muted); }
    .field.leg {
      border: none;
      background: transparent;
      color: var(--rain);
      font-size: 12px;
      font-weight: 650;
      padding: 0;
      width: auto;
      min-width: 8em;
    }
    .stop-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }
    .stop.active {
      outline: 2px solid rgba(15, 107, 92, 0.35);
    }
    .title-edit {
      width: min(100%, 280px);
      font-size: 15px;
      font-weight: 700;
    }
    .add-stop {
      margin: 10px 16px 6px;
    }
    .edit-footer {
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 16px 14px;
      border-top: 1px solid var(--line);
      background: #fffcf6;
    }
    body.editing .edit-footer { display: flex; }
    .transit-edit {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .transit-edit::before {
      content: "↓";
      color: var(--rain);
    }
    .coord-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 6px;
      align-items: center;
    }
    .coord-row .field {
      font-size: 12px;
      padding: 6px 8px;
      font-variant-numeric: tabular-nums;
    }
    .edit-toast {
      position: fixed;
      left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(12px);
      background: rgba(28, 36, 33, 0.92);
      color: #fff;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 5000;
      max-width: min(92vw, 420px);
      text-align: center;
    }
    .edit-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    body.editing .stop.active {
      box-shadow: inset 0 0 0 2px rgba(15, 107, 92, 0.35);
    }
    .wx-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 16px 0 14px;
    }
    .wx-day {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      transition: 0.15s ease;
    }
    .wx-day:hover, .wx-day.active {
      border-color: var(--accent);
      box-shadow: var(--shadow);
    }
    .wx-day .d {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .wx-day .t {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .wx-day .desc {
      margin-top: 6px;
      font-size: 13px;
      color: var(--ink);
    }
    .wx-day .rain {
      margin-top: 4px;
      font-size: 12px;
      color: var(--rain);
    }
    @media (max-width: 720px) {
      html, body {
        height: 100%;
        overflow: hidden;
      }
      body { min-height: 100dvh; }
      .wrap {
        height: 100dvh;
        max-height: 100dvh;
        padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header { gap: 2px; margin-bottom: 4px; flex: 0 0 auto; }
      .eyebrow { display: none; }
      h1 { font-size: 20px; }
      .wx-board {
        margin: 6px 0 8px;
        gap: 6px;
        flex: 0 0 auto;
        grid-template-columns: repeat(4, minmax(108px, 1fr));
        overflow-x: auto;
      }
      .wx-day { padding: 8px 10px; }
      .wx-day .t { font-size: 15px; }
      .wx-day .rain { display: none; }
      .layout {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 0;
      }
      .map-card {
        position: static;
        flex: 0 0 auto;
        z-index: 1;
      }
      .map-card .legend,
      .map-card .card-head .meta { display: none; }
      .map-card .card-head { padding: 8px 12px; }
      .map-card .card-head h2 { font-size: 14px; }
      #map {
        height: 32vh !important;
        min-height: 180px !important;
      }
      .leaflet-tile-pane { opacity: 0.72; }
      .leaflet-popup-content {
        margin: 8px 10px;
        min-width: 110px;
        font-size: 12px;
      }
      .popup-title { font-size: 13px; }
      .list-card {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      .timeline {
        max-height: none;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }
      .card-head .head-actions {
        gap: 6px;
      }
      .btn { padding: 5px 8px; }
      body.editing .map-card .legend {
        display: block;
        font-size: 11px;
        padding: 6px 12px 8px;
      }
      body.editing .edit-footer {
        padding-bottom: calc(10px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <nav class="crumb" aria-label="面包屑">
        <a href="./">城市路书</a>
        <span class="sep">/</span>
        <span class="here">昆明</span>
      </nav>
    </header>

    <div class="wx-board" id="wxBoard"></div>

    <div class="layout">
      <section class="card map-card">
        <div class="card-head">
          <h2 id="mapTitle">路线地图</h2>
          <div class="meta" id="mapMeta">站名旁数字为顺序</div>
        </div>
        <p class="edit-banner" id="mapEditHint">编辑中：先点选右侧地点，再点地图或拖动标记改位置</p>
        <div class="map-shell">
          <div id="map"></div>
        </div>
        <div class="legend" id="mapLegend">圆点旁为站名 · 连线上为交通耗时</div>
      </section>

      <section class="card list-card">
        <div class="card-head">
          <h2 id="listTitle">当日行程</h2>
          <div class="head-actions">
            <div class="meta" id="listMeta"></div>
            <button type="button" class="btn" id="editToggle">编辑行程</button>
          </div>
        </div>
        <p class="edit-banner">改站名后点「搜索定位」，或选中地点后点地图 / 拖标记；改经纬度后地图会立刻更新。</p>
        <div class="timeline" id="timeline"></div>
        <div class="edit-footer">
          <button type="button" class="btn" id="btnExport">导出 JSON</button>
          <button type="button" class="btn" id="btnCopy">复制 JSON</button>
          <button type="button" class="btn danger" id="btnReset">恢复默认</button>
        </div>
      </section>
    </div>
  </div>
  <div class="edit-toast" id="editToast" aria-live="polite"></div>

  <script>
    const HOTEL = {
      name: "全季酒店（龙湖时代金融中心店）",
      lat: 24.9968,
      lng: 102.7345,

    };

    const DAYS = [
      {

        summary: "主线：云南美术馆 → 黄公东街 → 翠湖公园 → 酒杯楼 → 东方书店",
        stops: [

      {

          { time: "12:00–13:00", name: "上坐过桥米线（滇池华府店）", lat: 24.9795, lng: 102.6988, kind: "food", desc: "" },
          { time: "13:30–16:30", name: "宝丰湿地公园", lat: 24.9612, lng: 102.6825, kind: "spot", desc: "亦可改官渡古镇" },
          { time: "17:00+", name: "牧兰盛·新亚洲店", lat: 25.0018, lng: 102.7046, kind: "food", desc: "牛小串烧烤" },
          { time: "晚饭后", name: "返回酒店", lat: HOTEL.lat, lng: HOTEL.lng, kind: "hotel", desc: "" }
        ],
        legs: [
          { from: 0, to: 1, label: "打车 ≈20min" },
          { from: 1, to: 2, label: "打车 ≈9min" },
          { from: 2, to: 3, label: "打车 ≈10min" },
          { from: 3, to: 4, label: "打车 ≈9min" },
          { from: 4, to: 5, label: "打车 ≈10–15min" }
        ]
      },
      {
        id: "d29",
        date: "2026-08-29",
        label: "周六 8/29",
        title: "联大 · 云大 · 翠湖",
        summary: "西南联大旧址 → 云大 → 山也 → 文林街/翠湖 → 祥云荟馆",
        stops: [

        ],

          { from: 2, to: 3, label: "返回酒店" },
          { from: 3, to: 4, label: "打车 ≈45–70min" }
        ]
      }
    ];

    const STORAGE_KEY = "city-guidebook:kunming:days:v1";
    const DEFAULT_DAYS = JSON.parse(JSON.stringify(DAYS));

    const WMO = {
      0: "晴", 1: "大部晴朗", 2: "局部多云", 3: "阴天",
      45: "雾", 48: "雾凇",
      51: "小毛毛雨", 53: "毛毛雨", 55: "强毛毛雨",
      61: "小雨", 63: "中雨", 65: "大雨",
      80: "阵雨", 81: "中阵雨", 82: "强阵雨",
      95: "雷阵雨", 96: "雷阵雨伴冰雹", 99: "强雷暴冰雹"
    };

    let map, layerGroup, activeDay = 0, stopMarkers = [];
    let editMode = false;
    let selectedStopIdx = null;
    let skipFitBounds = false;
    let toastTimer = null;
    const weatherByDate = {};

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function isMobile() {
      return window.matchMedia("(max-width: 720px)").matches;
    }

    function isViaStop(s) {
      return s && s.time === "途经";
    }

    function displayNumsFor(stops) {
      const nums = [];
      let n = 0;
      stops.forEach((s) => {
        if (isViaStop(s)) nums.push(null);
        else {
          n += 1;
          nums.push(n);
        }
      });
      return nums;
    }

    function rebuildLegs(day) {
      const prev = new Map((day.legs || []).map((l) => [l.from + ">" + l.to, l.label]));
      const sequential = new Map((day.legs || []).map((l) => [l.from, l.label]));
      day.legs = [];
      for (let i = 0; i < day.stops.length - 1; i++) {
        const key = i + ">" + (i + 1);
        day.legs.push({
          from: i,
          to: i + 1,
          label: prev.get(key) || sequential.get(i) || "步行"
        });
      }
    }

    function saveDays() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DAYS));
      } catch (e) { /* ignore quota */ }
    }

    function loadSavedDays() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed) || parsed.length !== DEFAULT_DAYS.length) return;
        parsed.forEach((d, i) => {
          if (!d || !Array.isArray(d.stops)) return;
          DAYS[i].title = d.title || DAYS[i].title;
          DAYS[i].summary = d.summary || DAYS[i].summary;
          DAYS[i].stops = d.stops;
          DAYS[i].legs = Array.isArray(d.legs) ? d.legs : [];
          rebuildLegs(DAYS[i]);
        });
      } catch (e) { /* ignore bad cache */ }
    }

    function refreshView(opts = {}) {
      skipFitBounds = !!opts.keepView;
      renderWeatherBoard();
      renderTimeline();
      drawDayOnMap();
      requestAnimationFrame(() => map && map.invalidateSize());
      skipFitBounds = false;
    }

    function refreshMapOnly(opts = {}) {
      skipFitBounds = !!opts.keepView;
      drawDayOnMap();
      syncCoordInputs();
      requestAnimationFrame(() => map && map.invalidateSize());
      skipFitBounds = false;
    }

    function commitChange(opts = {}) {
      rebuildLegs(DAYS[activeDay]);
      saveDays();
      if (opts.mapOnly) refreshMapOnly(opts);
      else refreshView(opts);
    }

    function showToast(msg, ms = 2200) {
      const el = document.getElementById("editToast");
      if (!el) return;
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), ms);
    }

    function syncCoordInputs() {
      if (!editMode) return;
      document.querySelectorAll(".stop[data-idx]").forEach((el) => {
        const idx = Number(el.dataset.idx);
        const s = DAYS[activeDay].stops[idx];
        if (!s) return;
        const lat = el.querySelector('[data-k="lat"]');
        const lng = el.querySelector('[data-k="lng"]');
        if (lat && document.activeElement !== lat) lat.value = s.lat;
        if (lng && document.activeElement !== lng) lng.value = s.lng;
      });
    }

    async function geocodeStop(idx) {
      const s = DAYS[activeDay].stops[idx];
      if (!s.name.trim()) {
        showToast("请先填写地点名称");
        return false;
      }
      const q = /昆明/.test(s.name) ? s.name.trim() : `昆明 ${s.name.trim()}`;
      showToast("正在搜索位置…");
      try {
        const url = "https://nominatim.openstreetmap.org/search?q="
          + encodeURIComponent(q) + "&format=json&limit=1";
        const res = await fetch(url, { headers: { "User-Agent": "city-guidebook/1.0" } });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (!data.length) {
          showToast("未找到该地点，请点地图手动定位");
          return false;
        }
        s.lat = +(+data[0].lat).toFixed(6);
        s.lng = +(+data[0].lon).toFixed(6);
        saveDays();
        selectedStopIdx = idx;
        refreshMapOnly({ keepView: true });
        map.panTo(toMapLatLng(s));
        showToast("地图已更新：" + s.name);
        return true;
      } catch (e) {
        showToast("搜索失败，请点地图或填坐标");
        return false;
      }
    }

    function applyCoords(idx, latVal, lngVal) {
      const lat = parseFloat(latVal);
      const lng = parseFloat(lngVal);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return false;
      const s = DAYS[activeDay].stops[idx];
      const nlat = +lat.toFixed(6);
      const nlng = +lng.toFixed(6);
      if (s.lat === nlat && s.lng === nlng) return false;
      s.lat = nlat;
      s.lng = nlng;
      saveDays();
      selectedStopIdx = idx;
      refreshMapOnly({ keepView: true });
      map.panTo(toMapLatLng(s));
      showToast("地图已更新");
      return true;
    }

    function makeIcon(n, kind, name, via) {
      if (via) {
        return L.divIcon({
          className: "",
          html: `<div class="mk-wrap"><div class="mk via-pt" title="${escapeHtml(name)}"></div></div>`,
          iconSize: [14, 14],
          iconAnchor: [7, 7],
          popupAnchor: [0, -8]
        });
      }
      const cls = ["spot", "hotel", "transit", "food"].includes(kind) ? kind : "spot";
      const num = kind === "hotel" ? 1 : n;
      if (isMobile()) {
        return L.divIcon({
          className: "",
          html: `<div class="mk-wrap"><div class="mk ${cls}">${num}</div></div>`,
          iconSize: [30, 30],
          iconAnchor: [15, 15],
          popupAnchor: [0, -15]
        });
      }
      const label = kind === "hotel" ? "酒店" : String(name);
      const width = 40 + Math.min(label.length * 13, 280);
      return L.divIcon({
        className: "",
        html: `<div class="mk-wrap"><div class="mk ${cls}">${num}</div><span class="mk-name">${escapeHtml(label)}</span></div>`,
        iconSize: [width, 30],
        iconAnchor: [15, 15],
        popupAnchor: [0, -15]
      });
    }

    function makeRouteLabel(text) {
      const width = Math.max(72, text.length * 8 + 20);
      return L.divIcon({
        className: "",
        html: `<div class="route-label">${escapeHtml(text)}</div>`,
        iconSize: [width, 22],
        iconAnchor: [width / 2, 11]
      });
    }

    function midLatLng(a, b) {
      return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    }

    // 高德底图用 GCJ-02；持仓坐标按 WGS-84 录入，绘制前转换以免偏位
    function wgs84ToGcj02(lng, lat) {
      const a = 6378245.0;
      const ee = 0.00669342162296594323;
      function outOfChina(x, y) {
        return x < 72.004 || x > 137.8347 || y < 0.8293 || y > 55.8271;
      }
      function transformLat(x, y) {
        let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
        return ret;
      }
      function transformLng(x, y) {
        let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
        return ret;
      }
      if (outOfChina(lng, lat)) return [lat, lng];
      let dLat = transformLat(lng - 105.0, lat - 35.0);
      let dLng = transformLng(lng - 105.0, lat - 35.0);
      const radLat = lat / 180.0 * Math.PI;
      let magic = Math.sin(radLat);
      magic = 1 - ee * magic * magic;
      const sqrtMagic = Math.sqrt(magic);
      dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
      dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
      return [lat + dLat, lng + dLng];
    }

    // 地图点击得到 GCJ-02，存回 WGS-84
    function gcj02ToWgs84(lng, lat) {
      const [glat, glng] = wgs84ToGcj02(lng, lat);
      return {
        lat: +(lat * 2 - glat).toFixed(6),
        lng: +(lng * 2 - glng).toFixed(6)
      };
    }

    function toMapLatLng(s) {
      return wgs84ToGcj02(s.lng, s.lat);
    }

    function formatCnDate(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return `${y}年${m}月${d}日`;
    }

    function setEditMode(on) {
      editMode = on;
      document.body.classList.toggle("editing", on);
      const btn = document.getElementById("editToggle");
      btn.textContent = on ? "完成" : "编辑行程";
      btn.classList.toggle("primary", on);
      document.getElementById("mapMeta").textContent = on ? "选中地点后点地图 / 拖标记 / 搜索定位" : "站名旁数字为顺序";
      document.getElementById("mapLegend").textContent = on
        ? "改站名后点「搜索定位」；或直接改经纬度 / 点地图设位置"
        : "圆点旁为站名 · 连线上为交通耗时";
      if (!on) selectedStopIdx = null;
      refreshView({ keepView: true });
    }

    function selectStop(idx, fly = true) {
      selectedStopIdx = idx;
      document.querySelectorAll(".stop").forEach((el) => {
        el.classList.toggle("active", Number(el.dataset.idx) === idx);
      });
      const s = DAYS[activeDay].stops[idx];
      if (!s || !fly) return;
      map.invalidateSize();
      map.flyTo(toMapLatLng(s), isMobile() ? 14 : 15, { duration: 0.35 });
      const marker = stopMarkers[idx];
      if (marker && !editMode) marker.openPopup();
    }

    function moveStopToMapLatLng(idx, mapLat, mapLng) {
      const wgs = gcj02ToWgs84(mapLng, mapLat);
      const s = DAYS[activeDay].stops[idx];
      s.lat = wgs.lat;
      s.lng = wgs.lng;
      saveDays();
      selectedStopIdx = idx;
      refreshMapOnly({ keepView: true });
      syncCoordInputs();
      showToast("地图已更新");
    }

    function addStopAfter(idx) {
      const day = DAYS[activeDay];
      const base = day.stops[idx] || day.stops[day.stops.length - 1] || {
        lat: 25.04, lng: 102.71
      };
      const insertAt = idx == null ? day.stops.length : idx + 1;
      day.stops.splice(insertAt, 0, {
        time: "",
        name: "新地点",
        lat: base.lat,
        lng: base.lng,
        kind: "spot",
        desc: ""
      });
      selectedStopIdx = insertAt;
      commitChange({ keepView: true });
    }

    function deleteStop(idx) {
      const day = DAYS[activeDay];
      if (day.stops.length <= 1) return;
      day.stops.splice(idx, 1);
      if (selectedStopIdx === idx) selectedStopIdx = null;
      else if (selectedStopIdx != null && selectedStopIdx > idx) selectedStopIdx -= 1;
      commitChange({ keepView: true });
    }

    function moveStop(idx, dir) {
      const day = DAYS[activeDay];
      const j = idx + dir;
      if (j < 0 || j >= day.stops.length) return;
      const tmp = day.stops[idx];
      day.stops[idx] = day.stops[j];
      day.stops[j] = tmp;
      selectedStopIdx = j;
      commitChange({ keepView: true });
    }

    function exportDays() {
      const blob = new Blob([JSON.stringify(DAYS, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "kunming-days.json";
      a.click();
      URL.revokeObjectURL(a.href);
    }

    async function copyDays() {
      const text = JSON.stringify(DAYS, null, 2);
      try {
        await navigator.clipboard.writeText(text);
        alert("已复制到剪贴板");
      } catch (e) {
        prompt("复制下面的 JSON：", text);
      }
    }

    function resetDays() {
      if (!confirm("恢复为页面默认行程？本机改动会清除。")) return;
      const fresh = JSON.parse(JSON.stringify(DEFAULT_DAYS));
      fresh.forEach((d, i) => { DAYS[i] = d; });
      localStorage.removeItem(STORAGE_KEY);
      selectedStopIdx = null;
      refreshView();
    }

    function renderWeatherBoard() {
      const board = document.getElementById("wxBoard");
      board.innerHTML = "";
      DAYS.forEach((d, i) => {
        const w = weatherByDate[d.date];
        const el = document.createElement("div");
        el.className = "wx-day" + (i === activeDay ? " active" : "");
        el.onclick = () => selectDay(i);
        if (!w) {
          el.innerHTML = `<div class="d">${d.label}</div><div class="t">—</div><div class="desc">天气加载中</div>`;
        } else {
          el.innerHTML = `
            <div class="d">${d.label}</div>
            <div class="t">${w.tMax}° / ${w.tMin}°</div>
            <div class="desc">${w.desc}</div>
            <div class="rain">降水 ${w.rain} mm</div>
          `;
        }
        board.appendChild(el);
      });
    }

    function renderTimeline() {
      const d = DAYS[activeDay];
      const titleEl = document.getElementById("listTitle");
      const metaEl = document.getElementById("listMeta");
      document.getElementById("mapTitle").textContent = d.label + " · 路线地图";
      metaEl.textContent = formatCnDate(d.date);

      if (editMode) {
        titleEl.innerHTML = "";
        const input = document.createElement("input");
        input.className = "field title-edit";
        input.value = d.title;
        input.placeholder = "当日标题";
        input.oninput = () => { d.title = input.value; saveDays(); };
        titleEl.appendChild(input);
      } else {
        titleEl.textContent = d.title;
      }

      const box = document.getElementById("timeline");
      box.innerHTML = "";
      const nums = displayNumsFor(d.stops);

      d.stops.forEach((s, idx) => {
        if (!editMode && isViaStop(s)) return;

        const stop = document.createElement("div");
        stop.className = "stop" + (selectedStopIdx === idx ? " active" : "");
        stop.dataset.idx = String(idx);

        if (editMode) {
          const num = isViaStop(s) ? "途" : (nums[idx] || "");
          stop.innerHTML = `
            <div class="stop-edit" style="grid-column: 1 / -1">
              <div class="row">
                <input class="field time" data-k="time" value="${escapeHtml(s.time)}" placeholder="时间" />
                <input class="field name" data-k="name" value="${escapeHtml(s.name)}" placeholder="地点名称" />
              </div>
              <input class="field desc" data-k="desc" value="${escapeHtml(s.desc || "")}" placeholder="备注（可空）" />
              <div class="coord-row">
                <input class="field" data-k="lat" inputmode="decimal" value="${s.lat}" placeholder="纬度 lat" />
                <input class="field" data-k="lng" inputmode="decimal" value="${s.lng}" placeholder="经度 lng" />
                <button type="button" class="btn tiny" data-act="geo">搜索定位</button>
              </div>
              <div class="stop-tools">
                <span class="meta">#${num}</span>
                <select class="field" data-k="kind" style="width:auto;padding:4px 8px">
                  <option value="spot">地点</option>
                  <option value="food">吃饭</option>
                  <option value="hotel">酒店</option>
                  <option value="transit">交通</option>
                </select>
                <button type="button" class="btn tiny" data-act="pin">选中定位</button>
                <button type="button" class="btn tiny" data-act="up">上移</button>
                <button type="button" class="btn tiny" data-act="down">下移</button>
                <button type="button" class="btn tiny" data-act="add">下方加站</button>
                <button type="button" class="btn tiny danger" data-act="del">删除</button>
              </div>
            </div>
          `;
          stop.querySelector('[data-k="kind"]').value = s.kind || "spot";
          stop.querySelectorAll("[data-k]").forEach((el) => {
            const key = el.dataset.k;
            const syncValue = () => { s[key] = el.value; };
            el.addEventListener("focus", () => selectStop(idx, false));
            el.addEventListener("input", () => {
              syncValue();
              saveDays();
            });
            el.addEventListener("blur", () => {
              syncValue();
              saveDays();
              if (key === "lat" || key === "lng") {
                const latEl = stop.querySelector('[data-k="lat"]');
                const lngEl = stop.querySelector('[data-k="lng"]');
                applyCoords(idx, latEl.value, lngEl.value);
              } else if (key === "name" || key === "kind" || key === "time") {
                refreshMapOnly({ keepView: true });
              }
            });
            el.addEventListener("keydown", (e) => {
              if (e.key === "Enter") { e.preventDefault(); el.blur(); }
            });
          });
          stop.querySelectorAll("[data-act]").forEach((btn) => {
            btn.onclick = (e) => {
              e.stopPropagation();
              const act = btn.dataset.act;
              if (act === "pin") selectStop(idx, true);
              if (act === "geo") geocodeStop(idx);
              if (act === "up") moveStop(idx, -1);
              if (act === "down") moveStop(idx, 1);
              if (act === "add") addStopAfter(idx);
              if (act === "del") deleteStop(idx);
            };
          });
          stop.onclick = (e) => {
            if (e.target.closest("input, select, button")) return;
            selectStop(idx, true);
          };
        } else {
          const num = nums[idx];
          stop.innerHTML = `
            <div class="time">${escapeHtml(s.time)}</div>
            <div>
              <h3>${num}. ${escapeHtml(s.name)}</h3>
              ${s.desc ? `<p>${escapeHtml(s.desc)}</p>` : ""}
            </div>
          `;
          stop.onclick = () => {
            selectStop(idx, true);
          };
        }
        box.appendChild(stop);

        const leg = d.legs.find(l => l.from === idx);
        if (!leg) return;

        if (editMode) {
          const t = document.createElement("div");
          t.className = "transit transit-edit";
          const input = document.createElement("input");
          input.className = "field leg";
          input.value = leg.label;
          input.placeholder = "交通方式，如 步行 / 打车 ≈20min";
          input.oninput = () => { leg.label = input.value; saveDays(); };
          input.onblur = () => refreshMapOnly({ keepView: true });
          t.appendChild(input);
          box.appendChild(t);
          return;
        }

        if (isViaStop(s)) return;

        const viaNames = [];
        let cursor = leg.to;
        while (isViaStop(d.stops[cursor])) {
          viaNames.push(d.stops[cursor].name);
          const nextLeg = d.legs.find(l => l.from === cursor);
          if (!nextLeg) break;
          cursor = nextLeg.to;
        }

        const t = document.createElement("div");
        t.className = "transit";
        if (viaNames.length) {
          t.innerHTML = `↓ ${escapeHtml(leg.label)}<span class="via">途经 ${escapeHtml(viaNames.join("、"))}</span>`;
        } else {
          t.textContent = "↓ " + leg.label;
        }
        box.appendChild(t);
      });

      if (editMode) {
        const add = document.createElement("button");
        add.type = "button";
        add.className = "btn add-stop";
        add.textContent = "+ 添加地点";
        add.onclick = () => addStopAfter(d.stops.length - 1);
        box.appendChild(add);
      }
    }

    function drawDayOnMap() {
      if (layerGroup) layerGroup.clearLayers();
      else layerGroup = L.layerGroup().addTo(map);

      const d = DAYS[activeDay];
      if (!d.stops.length) return;
      const latlngs = d.stops.map(toMapLatLng);

      layerGroup.addLayer(L.polyline(latlngs, {
        color: "#0f6b5c",
        weight: 3,
        opacity: 0.9,
        dashArray: "5 7",
        lineCap: "round",
        lineJoin: "round"
      }));

      d.legs.forEach((leg) => {
        if (isMobile()) return;
        const a = latlngs[leg.from];
        const b = latlngs[leg.to];
        if (!a || !b) return;
        layerGroup.addLayer(L.marker(midLatLng(a, b), {
          icon: makeRouteLabel(leg.label),
          interactive: false,
          keyboard: false,
          zIndexOffset: 200
        }));
      });

      stopMarkers = [];
      const nums = displayNumsFor(d.stops);
      d.stops.forEach((s, i) => {
        const via = isViaStop(s);
        const m = L.marker(toMapLatLng(s), {
          icon: makeIcon(nums[i] || 0, s.kind, s.name, via),
          zIndexOffset: via ? 300 : 400,
          draggable: editMode
        }).bindPopup(`
          <div class="popup-time">${escapeHtml(s.time)}</div>
          <div class="popup-title">${escapeHtml(s.name)}</div>
          ${s.desc ? `<div class="popup-desc">${escapeHtml(s.desc)}</div>` : ""}
        `);
        m.on("click", () => selectStop(i, false));
        if (editMode) {
          m.on("dragend", () => {
            const ll = m.getLatLng();
            moveStopToMapLatLng(i, ll.lat, ll.lng);
          });
        }
        layerGroup.addLayer(m);
        stopMarkers.push(m);
      });

      if (!skipFitBounds) {
        map.fitBounds(latlngs, { padding: isMobile() ? [24, 24] : [56, 56], maxZoom: isMobile() ? 13 : 14 });
      }
    }

    function selectDay(i) {
      activeDay = i;
      selectedStopIdx = null;
      refreshView();
    }

    async function loadWeather() {
      try {
        const url = "https://api.open-meteo.com/v1/forecast"
          + "?latitude=25.04&longitude=102.72"
          + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum"
          + "&timezone=Asia%2FShanghai"
          + "&start_date=2026-08-27&end_date=2026-08-30";
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const daily = data.daily;
        daily.time.forEach((date, i) => {
          const code = daily.weather_code[i];
          weatherByDate[date] = {
            tMax: Math.round(daily.temperature_2m_max[i]),
            tMin: Math.round(daily.temperature_2m_min[i]),
            rain: (daily.precipitation_sum[i] ?? 0).toFixed(1),
            desc: WMO[code] || ("天气代码 " + code)
          };
        });
      } catch (e) {
        // weather cards stay as loading placeholders
      }
      renderWeatherBoard();
    }

    function initMap() {
      map = L.map("map", { scrollWheelZoom: true });
      L.tileLayer("https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
        maxZoom: 18,
        subdomains: "1234",
        attribution: "&copy; 高德地图"
      }).addTo(map);
      map.on("click", (e) => {
        if (!editMode || selectedStopIdx == null) return;
        moveStopToMapLatLng(selectedStopIdx, e.latlng.lat, e.latlng.lng);
      });
      selectDay(0);
    }

    function bindEditChrome() {
      document.getElementById("editToggle").onclick = () => setEditMode(!editMode);
      document.getElementById("btnExport").onclick = exportDays;
      document.getElementById("btnCopy").onclick = copyDays;
      document.getElementById("btnReset").onclick = resetDays;
    }

    loadSavedDays();
    bindEditChrome();
    initMap();
    loadWeather();
  </script>
</body>
</html>
