<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>昆明路书</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #f3f0e8;
      --ink: #1c2421;
      --muted: #5c6b64;
      --card: #fffcf6;
      --line: #d9d2c4;
      --accent: #0f6b5c;
      --accent-soft: #d8efe8;
      --warm: #c45c26;
      --rain: #3d6f8c;
      --shadow: 0 10px 30px rgba(28, 36, 33, 0.08);
      --radius: 16px;
      --font: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #e7f3ef 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #f7e8dc 0%, transparent 50%),
        var(--bg);
      min-height: 100vh;
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }
    header {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }
    .crumb {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .crumb a {
      color: var(--accent);
      text-decoration: none;
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    .crumb a:hover { opacity: 0.75; }
    .crumb .sep {
      color: var(--line);
      font-size: 12px;
    }
    .crumb .here {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.16em;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
    }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(30px, 4vw, 42px);
      line-height: 1.15;
      letter-spacing: 0.02em;
    }
    .layout {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 16px;
      margin-top: 14px;
    }
    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card-head {
      padding: 14px 16px 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      border-bottom: 1px solid var(--line);
      background: #fffcf6;
    }
    .card-head h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: -0.01em;
    }
    .card-head .meta {
      color: var(--muted);
      font-size: 12px;
    }
    .map-shell {
      position: relative;
      background: transparent;
    }
    #map {
      height: calc(100vh - 240px);
      min-height: 520px;
      width: 100%;
      background: transparent;
    }
    .leaflet-container {
      font-family: var(--font);
      background: transparent !important;
    }
    .leaflet-div-icon {
      background: transparent !important;
      border: none !important;
    }
    /* 底图半透明叠在页面底色上，避免发灰发白 */
    .leaflet-tile-pane {
      opacity: 0.38;
    }
    .leaflet-control-attribution {
      background: transparent !important;
      box-shadow: none !important;
      color: var(--muted) !important;
    }
    .leaflet-control-zoom a {
      color: var(--ink) !important;
    }
    .leaflet-popup-content-wrapper {
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(28,36,33,0.12);
      border: 1px solid var(--line);
    }
    .leaflet-popup-content {
      margin: 10px 12px;
      font-family: var(--font);
      line-height: 1.45;
      min-width: 140px;
    }
    .leaflet-popup-tip {
      box-shadow: none;
    }
    .mk-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      filter: drop-shadow(0 4px 10px rgba(28,36,33,0.22));
    }
    .mk {
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: 2.5px solid #fff;
      box-shadow: 0 0 0 2px rgba(15,107,92,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .mk.hotel { background: #9a5b2f; box-shadow: 0 0 0 2px rgba(154,91,47,0.2); }
    .mk.transit { background: #3d6f8c; box-shadow: 0 0 0 2px rgba(61,111,140,0.2); }
    .mk.food { background: #c45c26; box-shadow: 0 0 0 2px rgba(196,92,38,0.2); }
    .mk-name {
      background: #fffcf6;
      border: 1px solid rgba(28,36,33,0.12);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
      padding: 5px 9px;
      border-radius: 8px;
      white-space: nowrap;
    }
    .route-label {
      background: #fffcf6;
      border: 1px solid rgba(15,107,92,0.28);
      color: #0f6b5c;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 3px 10px rgba(28,36,33,0.14);
      pointer-events: none;
    }
    .popup-time {
      color: var(--warm);
      font-size: 12px;
      font-weight: 650;
      margin-bottom: 2px;
      font-variant-numeric: tabular-nums;
    }
    .popup-title {
      font-weight: 700;
      font-size: 14px;
    }
    .popup-desc {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }
    .legend {
      padding: 10px 16px 12px;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      background: #fffcf6;
    }
    .list-card {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .timeline {
      padding: 8px 8px 16px;
      max-height: calc(100vh - 220px);
      min-height: 520px;
      overflow: auto;
      flex: 1;
    }
    .stop {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 10px;
      padding: 12px;
      border-radius: 12px;
      margin: 6px 8px;
    }
    .stop:hover, .stop.active {
      background: var(--accent-soft);
    }
    .time {
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: var(--warm);
      font-weight: 700;
      padding-top: 2px;
    }
    .stop h3 {
      margin: 0 0 4px;
      font-size: 15px;
    }
    .stop p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .journal {
      margin: 10px 14px 4px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px dashed #c5d9d2;
      background: #f7fbf9;
    }
    .journal label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .journal textarea {
      width: 100%;
      min-height: 88px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      font-size: 13px;
      line-height: 1.55;
      color: var(--ink);
      background: #fffcf6;
    }
    .journal textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 107, 92, 0.12);
    }
    .journal .hint {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
    }
    .stop-desc {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      min-height: 1.4em;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid transparent;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .stop-desc:hover,
    .stop-desc:focus {
      border-color: var(--line);
      background: #fffcf6;
    }
    .stop-desc:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 107, 92, 0.1);
    }
    .stop-desc:empty::before {
      content: attr(data-placeholder);
      color: #9aa8a2;
    }
    .transit {
      margin: 0 18px;
      padding: 6px 10px 6px 82px;
      font-size: 12px;
      color: var(--rain);
      border-left: 2px dashed #b7c9c2;
      position: relative;
      line-height: 1.45;
    }
    .transit .via {
      color: var(--muted);
      margin-left: 6px;
    }
    .mk.via-pt {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      font-size: 0;
      background: #7a8f87;
      border-width: 2px;
      box-shadow: 0 0 0 1.5px rgba(122, 143, 135, 0.25);
    }
    .wx-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 16px 0 14px;
    }
    .wx-day {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      transition: 0.15s ease;
    }
    .wx-day:hover, .wx-day.active {
      border-color: var(--accent);
      box-shadow: var(--shadow);
    }
    .wx-day .d {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .wx-day .t {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .wx-day .desc {
      margin-top: 6px;
      font-size: 13px;
      color: var(--ink);
    }
    .wx-day .rain {
      margin-top: 4px;
      font-size: 12px;
      color: var(--rain);
    }
    @media (max-width: 720px) {
      html, body {
        height: 100%;
        overflow: hidden;
      }
      body { min-height: 100dvh; }
      .wrap {
        height: 100dvh;
        max-height: 100dvh;
        padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header { gap: 2px; margin-bottom: 4px; flex: 0 0 auto; }
      .eyebrow { display: none; }
      h1 { font-size: 20px; }
      .wx-board {
        margin: 6px 0 8px;
        gap: 6px;
        flex: 0 0 auto;
        grid-template-columns: repeat(4, minmax(108px, 1fr));
        overflow-x: auto;
      }
      .wx-day { padding: 8px 10px; }
      .wx-day .t { font-size: 15px; }
      .wx-day .rain { display: none; }
      .layout {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 0;
      }
      .map-card {
        position: static;
        flex: 0 0 auto;
        z-index: 1;
      }
      .map-card .legend,
      .map-card .card-head .meta { display: none; }
      .map-card .card-head { padding: 8px 12px; }
      .map-card .card-head h2 { font-size: 14px; }
      #map {
        height: 32vh !important;
        min-height: 180px !important;
      }
      .leaflet-tile-pane { opacity: 0.72; }
      .leaflet-popup-content {
        margin: 8px 10px;
        min-width: 110px;
        font-size: 12px;
      }
      .popup-title { font-size: 13px; }
      .list-card {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      .timeline {
        max-height: none;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <nav class="crumb" aria-label="面包屑">
        <a href="./">城市路书</a>
        <span class="sep">/</span>
        <span class="here">昆明</span>
      </nav>
    </header>

    <div class="wx-board" id="wxBoard"></div>

    <div class="layout">
      <section class="card map-card">
        <div class="card-head">
          <h2 id="mapTitle">路线地图</h2>
          <div class="meta">站名旁数字为顺序</div>
        </div>
        <div class="map-shell">
          <div id="map"></div>
        </div>
        <div class="legend">圆点旁为站名 · 连线上为交通耗时</div>
      </section>

      <section class="card list-card">
        <div class="card-head">
          <h2 id="listTitle">当日行程</h2>
          <div class="meta" id="listMeta"></div>
        </div>
        <div class="timeline" id="timeline"></div>
      </section>
    </div>
  </div>

      {

          { time: "视航班", name: "昆明长水国际机场", lat: 25.1019, lng: 102.9292, kind: "transit", desc: "建议起飞前 3 小时抵达机场" }

    const WMO = {
      0: "晴", 1: "大部晴朗", 2: "局部多云", 3: "阴天",
      45: "雾", 48: "雾凇",
      51: "小毛毛雨", 53: "毛毛雨", 55: "强毛毛雨",
      61: "小雨", 63: "中雨", 65: "大雨",
      80: "阵雨", 81: "中阵雨", 82: "强阵雨",
      95: "雷阵雨", 96: "雷阵雨伴冰雹", 99: "强雷暴冰雹"
    };

    const NOTES_KEY = "city-guidebook:kunming:notes:v1";

    let map, layerGroup, activeDay = 0, stopMarkers = [];
    let notesByDay = loadNotes();
    let saveNotesTimer = null;
    const weatherByDate = {};

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function isMobile() {
      return window.matchMedia("(max-width: 720px)").matches;
    }

    function isViaStop(s) {
      return s && s.time === "途经";
    }

    function displayNumsFor(stops) {
      const nums = [];
      let n = 0;
      stops.forEach((s) => {
        if (isViaStop(s)) nums.push(null);
        else {
          n += 1;
          nums.push(n);
        }
      });
      return nums;
    }

    function makeIcon(n, kind, name, via) {
      if (via) {
        return L.divIcon({
          className: "",
          html: `<div class="mk-wrap"><div class="mk via-pt" title="${escapeHtml(name)}"></div></div>`,
          iconSize: [14, 14],
          iconAnchor: [7, 7],
          popupAnchor: [0, -8]
        });
      }
      const cls = ["spot", "hotel", "transit", "food"].includes(kind) ? kind : "spot";
      const num = kind === "hotel" ? 1 : n;
      if (isMobile()) {
        return L.divIcon({
          className: "",
          html: `<div class="mk-wrap"><div class="mk ${cls}">${num}</div></div>`,
          iconSize: [30, 30],
          iconAnchor: [15, 15],
          popupAnchor: [0, -15]
        });
      }
      const label = kind === "hotel" ? "酒店" : String(name);
      const width = 40 + Math.min(label.length * 13, 280);
      return L.divIcon({
        className: "",
        html: `<div class="mk-wrap"><div class="mk ${cls}">${num}</div><span class="mk-name">${escapeHtml(label)}</span></div>`,
        iconSize: [width, 30],
        iconAnchor: [15, 15],
        popupAnchor: [0, -15]
      });
    }

    function makeRouteLabel(text) {
      const width = Math.max(72, text.length * 8 + 20);
      return L.divIcon({
        className: "",
        html: `<div class="route-label">${escapeHtml(text)}</div>`,
        iconSize: [width, 22],
        iconAnchor: [width / 2, 11]
      });
    }

    function midLatLng(a, b) {
      return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    }

    // 高德底图用 GCJ-02；持仓坐标按 WGS-84 录入，绘制前转换以免偏位
    function wgs84ToGcj02(lng, lat) {
      const a = 6378245.0;
      const ee = 0.00669342162296594323;
      function outOfChina(x, y) {
        return x < 72.004 || x > 137.8347 || y < 0.8293 || y > 55.8271;
      }
      function transformLat(x, y) {
        let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
        return ret;
      }
      function transformLng(x, y) {
        let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
        return ret;
      }
      if (outOfChina(lng, lat)) return [lat, lng];
      let dLat = transformLat(lng - 105.0, lat - 35.0);
      let dLng = transformLng(lng - 105.0, lat - 35.0);
      const radLat = lat / 180.0 * Math.PI;
      let magic = Math.sin(radLat);
      magic = 1 - ee * magic * magic;
      const sqrtMagic = Math.sqrt(magic);
      dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
      dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
      return [lat + dLat, lng + dLng];
    }

    function toMapLatLng(s) {
      return wgs84ToGcj02(s.lng, s.lat);
    }

    function formatCnDate(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return `${y}年${m}月${d}日`;
    }

    function loadNotes() {
      try {
        const raw = localStorage.getItem(NOTES_KEY);
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch (e) {
        return {};
      }
    }

    function dayNotes(dayId) {
      if (!notesByDay[dayId]) notesByDay[dayId] = { journal: "", stops: {} };
      if (!notesByDay[dayId].stops) notesByDay[dayId].stops = {};
      return notesByDay[dayId];
    }

    function scheduleSaveNotes() {
      clearTimeout(saveNotesTimer);
      saveNotesTimer = setTimeout(saveNotes, 350);
    }

    function saveNotes() {
      try {
        localStorage.setItem(NOTES_KEY, JSON.stringify(notesByDay));
      } catch (e) { /* ignore quota */ }
    }

    function stopDescText(dayId, idx, fallback) {
      const saved = dayNotes(dayId).stops[String(idx)];
      if (saved !== undefined && saved !== null) return saved;
      return fallback || "";
    }

    function renderTimeline() {
      const d = DAYS[activeDay];
      document.getElementById("listTitle").textContent = d.title;
      document.getElementById("listMeta").textContent = formatCnDate(d.date);
      document.getElementById("mapTitle").textContent = d.label + " · 路线地图";
      const box = document.getElementById("timeline");
      box.innerHTML = "";
      const nums = displayNumsFor(d.stops);

      const journal = document.createElement("div");
      journal.className = "journal";
      const journalLabel = document.createElement("label");
      journalLabel.textContent = "游后感";
      journalLabel.setAttribute("for", "dayJournal");
      const journalInput = document.createElement("textarea");
      journalInput.id = "dayJournal";
      journalInput.placeholder = "写下当天的感受、见闻、推荐或避雷…";
      journalInput.value = dayNotes(d.id).journal || "";
      journalInput.addEventListener("input", () => {
        dayNotes(d.id).journal = journalInput.value;
        scheduleSaveNotes();
      });
      const journalHint = document.createElement("div");
      journalHint.className = "hint";
      journalHint.textContent = "自动保存在本机浏览器，换设备不会同步";
      journal.appendChild(journalLabel);
      journal.appendChild(journalInput);
      journal.appendChild(journalHint);
      box.appendChild(journal);

      d.stops.forEach((s, idx) => {
        if (isViaStop(s)) return;

        const stop = document.createElement("div");
        stop.className = "stop";
        const num = nums[idx];

        const timeEl = document.createElement("div");
        timeEl.className = "time";
        timeEl.textContent = s.time;

        const body = document.createElement("div");
        const title = document.createElement("h3");
        title.textContent = `${num}. ${s.name}`;

        const desc = document.createElement("p");
        desc.className = "stop-desc";
        desc.contentEditable = "true";
        desc.spellcheck = true;
        desc.dataset.placeholder = "行程描述 / 游后感";
        desc.textContent = stopDescText(d.id, idx, s.desc);

        desc.addEventListener("click", (e) => e.stopPropagation());
        desc.addEventListener("input", () => {
          dayNotes(d.id).stops[String(idx)] = desc.textContent.trim();
          scheduleSaveNotes();
          refreshStopPopup(idx);
        });
        desc.addEventListener("blur", () => {
          dayNotes(d.id).stops[String(idx)] = desc.textContent.trim();
          saveNotes();
          refreshStopPopup(idx);
        });

        body.appendChild(title);
        body.appendChild(desc);
        stop.appendChild(timeEl);
        stop.appendChild(body);

        stop.onclick = () => {
          document.querySelectorAll(".stop").forEach(x => x.classList.remove("active"));
          stop.classList.add("active");
          map.invalidateSize();
          const ll = toMapLatLng(s);
          map.flyTo(ll, isMobile() ? 13 : 15, { duration: 0.45 });
          const marker = stopMarkers[idx];
          if (marker) marker.openPopup();
        };
        box.appendChild(stop);

        const leg = d.legs.find(l => l.from === idx);
        if (!leg) return;

        const viaNames = [];
        let cursor = leg.to;
        while (isViaStop(d.stops[cursor])) {
          viaNames.push(d.stops[cursor].name);
          const nextLeg = d.legs.find(l => l.from === cursor);
          if (!nextLeg) break;
          cursor = nextLeg.to;
        }

        const t = document.createElement("div");
        t.className = "transit";
        if (viaNames.length) {
          t.innerHTML = `↓ ${escapeHtml(leg.label)}<span class="via">途经 ${escapeHtml(viaNames.join("、"))}</span>`;
        } else {
          t.textContent = "↓ " + leg.label;
        }
        box.appendChild(t);
      });
    }
    function renderWeatherBoard() {
      const board = document.getElementById("wxBoard");
      board.innerHTML = "";
      DAYS.forEach((d, i) => {
        const w = weatherByDate[d.date];
        const el = document.createElement("div");
        el.className = "wx-day" + (i === activeDay ? " active" : "");
        el.onclick = () => selectDay(i);
        if (!w) {
          el.innerHTML = `<div class="d">${d.label}</div><div class="t">—</div><div class="desc">天气加载中</div>`;
        } else {
          el.innerHTML = `
            <div class="d">${d.label}</div>
            <div class="t">${w.tMax}° / ${w.tMin}°</div>
            <div class="desc">${w.desc}</div>
            <div class="rain">降水 ${w.rain} mm</div>
          `;
        }
        board.appendChild(el);
      });
    }

    function refreshStopPopup(idx) {
      const d = DAYS[activeDay];
      const marker = stopMarkers[idx];
      const s = d.stops[idx];
      if (!marker || !s) return;
      const desc = stopDescText(d.id, idx, s.desc);
      marker.setPopupContent(`
        <div class="popup-time">${escapeHtml(s.time)}</div>
        <div class="popup-title">${escapeHtml(s.name)}</div>
        ${desc ? `<div class="popup-desc">${escapeHtml(desc)}</div>` : ""}
      `);
    }

    function drawDayOnMap() {
      if (layerGroup) layerGroup.clearLayers();
      else layerGroup = L.layerGroup().addTo(map);

      const d = DAYS[activeDay];
      if (!d.stops.length) return;
      const latlngs = d.stops.map(toMapLatLng);

      layerGroup.addLayer(L.polyline(latlngs, {
        color: "#0f6b5c",
        weight: 3,
        opacity: 0.9,
        dashArray: "5 7",
        lineCap: "round",
        lineJoin: "round"
      }));

      d.legs.forEach((leg) => {
        if (isMobile()) return;
        const a = latlngs[leg.from];
        const b = latlngs[leg.to];
        if (!a || !b) return;
        layerGroup.addLayer(L.marker(midLatLng(a, b), {
          icon: makeRouteLabel(leg.label),
          interactive: false,
          keyboard: false,
          zIndexOffset: 200
        }));
      });

      stopMarkers = [];
      const nums = displayNumsFor(d.stops);
      d.stops.forEach((s, i) => {
        const via = isViaStop(s);
        const m = L.marker(toMapLatLng(s), {
          icon: makeIcon(nums[i] || 0, s.kind, s.name, via),
          zIndexOffset: via ? 300 : 400
        }).bindPopup(() => {
          const desc = stopDescText(d.id, i, s.desc);
          return `
            <div class="popup-time">${escapeHtml(s.time)}</div>
            <div class="popup-title">${escapeHtml(s.name)}</div>
            ${desc ? `<div class="popup-desc">${escapeHtml(desc)}</div>` : ""}
          `;
        });
        layerGroup.addLayer(m);
        stopMarkers.push(m);
      });

      map.fitBounds(latlngs, { padding: isMobile() ? [24, 24] : [56, 56], maxZoom: isMobile() ? 13 : 14 });
    }

    function selectDay(i) {
      activeDay = i;
      renderWeatherBoard();
      renderTimeline();
      drawDayOnMap();
      requestAnimationFrame(() => map.invalidateSize());
    }

    async function loadWeather() {
      try {
        const url = "https://api.open-meteo.com/v1/forecast"
          + "?latitude=25.04&longitude=102.72"
          + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum"
          + "&timezone=Asia%2FShanghai"
          + "&start_date=2026-08-27&end_date=2026-08-30";
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const daily = data.daily;
        daily.time.forEach((date, i) => {
          const code = daily.weather_code[i];
          weatherByDate[date] = {
            tMax: Math.round(daily.temperature_2m_max[i]),
            tMin: Math.round(daily.temperature_2m_min[i]),
            rain: (daily.precipitation_sum[i] ?? 0).toFixed(1),
            desc: WMO[code] || ("天气代码 " + code)
          };
        });
      } catch (e) {
        // weather cards stay as loading placeholders
      }
      renderWeatherBoard();
    }

    function initMap() {
      map = L.map("map", { scrollWheelZoom: true });
      L.tileLayer("https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
        maxZoom: 18,
        subdomains: "1234",
        attribution: "&copy; 高德地图"
      }).addTo(map);
      selectDay(0);
    }

    initMap();
    loadWeather();
  </script>
</body>
</html>
