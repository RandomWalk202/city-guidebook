<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>城市路书</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #f3f0e8;
      --ink: #1c2421;
      --muted: #5c6b64;
      --card: #fffcf6;
      --line: #d9d2c4;
      --accent: #0f6b5c;
      --accent-soft: #d8efe8;
      --warm: #c45c26;
      --shadow: 0 10px 30px rgba(28, 36, 33, 0.08);
      --radius: 16px;
      --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #e7f3ef 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #f7e8dc 0%, transparent 50%),
        var(--bg);
      overflow: hidden;
    }
    .home {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      position: relative;
      z-index: 500;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      padding: 18px 22px 14px;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
    }
    h1 {
      margin: 6px 0 0;
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    .lede {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .count {
      flex: 0 0 auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      color: var(--muted);
      box-shadow: var(--shadow);
      margin-bottom: 6px;
    }
    .count strong {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .map-stage {
      position: relative;
      min-height: 0;
      margin: 0 16px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      background: var(--card);
    }
    #map {
      height: 100%;
      width: 100%;
      background: transparent;
    }
    .leaflet-container {
      font-family: var(--font);
      background: transparent !important;
    }
    .leaflet-div-icon {
      background: transparent !important;
      border: none !important;
    }
    .leaflet-tile-pane { opacity: 0.78; }
    .leaflet-control-attribution {
      background: transparent !important;
      box-shadow: none !important;
      color: var(--muted) !important;
    }
    .leaflet-control-zoom a { color: var(--ink) !important; }
    .city-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      cursor: pointer;
      filter: drop-shadow(0 4px 10px rgba(28,36,33,0.22));
    }
    .city-pin {
      position: relative;
      flex: 0 0 18px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid #fff;
      box-shadow: 0 0 0 3px rgba(15,107,92,0.22);
    }
    .city-pin::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2px solid rgba(15,107,92,0.45);
      animation: pulse 2.2s ease-out infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.7); opacity: 0.8; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .city-name {
      background: #fffcf6;
      border: 1px solid rgba(28,36,33,0.12);
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.25;
      padding: 6px 12px;
      border-radius: 10px;
    }
    .city-wrap:hover .city-name {
      border-color: var(--accent);
      color: var(--accent);
    }
    .city-panel {
      position: absolute;
      left: 16px;
      bottom: 28px;
      z-index: 500;
      width: min(280px, calc(100% - 32px));
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 12px;
    }
    .panel-label {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .city-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 8px;
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
    }
    .city-row:hover { background: var(--accent-soft); }
    .city-row .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      flex: 0 0 10px;
    }
    .city-row strong {
      display: block;
      font-size: 15px;
    }
    .city-row em {
      display: block;
      font-style: normal;
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }
    .city-row .go {
      margin-left: auto;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }
    @media (max-width: 640px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        padding: 14px 16px 10px;
      }
      .count { margin-bottom: 0; }
      .map-stage { margin: 0 10px 10px; }
      .city-panel { left: 12px; bottom: 22px; }
    }
  </style>
</head>
<body>
  <div class="home">
    <header>
      <div>
        <div class="eyebrow">City Field Guides</div>
        <h1>城市路书</h1>
        <p class="lede">点选地图上的城市，进入该城行程</p>
      </div>
      <div class="count">已收录 <strong id="cityCount">0</strong> 城</div>
    </header>

    <div class="map-stage">
      <div id="map" role="application" aria-label="中国城市地图"></div>
      <aside class="city-panel" aria-label="已收录城市">
        <div class="panel-label">已收录城市</div>
        <div id="cityList"></div>
      </aside>
    </div>
  </div>

  <script>
    // 后续新增城市：补一条记录并放对应 html 即可
    const CITIES = [
      {
        id: "kunming",
        name: "昆明",
        nameEn: "Kunming",
        lat: 25.04,
        lng: 102.72,
        href: "kunming.html",
        blurb: "2026.8 · 四日路书"
      }
    ];

    const CHINA_BOUNDS = [
      [18.2, 73.5],
      [53.6, 134.8]
    ];

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/"/g, "&quot;");
    }

    function wgs84ToGcj02(lng, lat) {
      const a = 6378245.0;
      const ee = 0.00669342162296594323;
      function outOfChina(x, y) {
        return x < 72.004 || x > 137.8347 || y < 0.8293 || y > 55.8271;
      }
      function transformLat(x, y) {
        let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
        return ret;
      }
      function transformLng(x, y) {
        let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
        return ret;
      }
      if (outOfChina(lng, lat)) return [lat, lng];
      let dLat = transformLat(lng - 105.0, lat - 35.0);
      let dLng = transformLng(lng - 105.0, lat - 35.0);
      const radLat = lat / 180.0 * Math.PI;
      let magic = Math.sin(radLat);
      magic = 1 - ee * magic * magic;
      const sqrtMagic = Math.sqrt(magic);
      dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
      dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
      return [lat + dLat, lng + dLng];
    }

    function cityLatLng(city) {
      return wgs84ToGcj02(city.lng, city.lat);
    }

    function makeCityIcon(city) {
      const width = 48 + Math.min(city.name.length * 16, 160);
      return L.divIcon({
        className: "",
        html: `<div class="city-wrap"><div class="city-pin"></div><span class="city-name">${escapeHtml(city.name)}</span></div>`,
        iconSize: [width, 28],
        iconAnchor: [9, 14],
        popupAnchor: [20, -12]
      });
    }

    function renderCityList() {
      document.getElementById("cityCount").textContent = String(CITIES.length);
      const box = document.getElementById("cityList");
      box.innerHTML = "";
      CITIES.forEach((city) => {
        const a = document.createElement("a");
        a.className = "city-row";
        a.href = city.href;
        a.innerHTML = `
          <span class="dot"></span>
          <span>
            <strong>${escapeHtml(city.name)}</strong>
            <em>${escapeHtml(city.blurb)}</em>
          </span>
          <span class="go">进入</span>
        `;
        box.appendChild(a);
      });
    }

    function initMap() {
      const map = L.map("map", {
        scrollWheelZoom: true,
        minZoom: 4,
        maxZoom: 10,
        maxBounds: L.latLngBounds(CHINA_BOUNDS).pad(0.25),
        maxBoundsViscosity: 0.7
      });
      L.tileLayer("https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
        maxZoom: 18,
        subdomains: "1234",
        attribution: "&copy; 高德地图"
      }).addTo(map);
      map.fitBounds(CHINA_BOUNDS, { padding: [28, 28], maxZoom: 5 });
      requestAnimationFrame(() => map.invalidateSize());

      CITIES.forEach((city) => {
        const marker = L.marker(cityLatLng(city), {
          icon: makeCityIcon(city),
          title: city.name + " · 进入路书",
          riseOnHover: true,
          keyboard: true,
          zIndexOffset: 400
        }).addTo(map);
        marker.on("click", () => {
          window.location.href = city.href;
        });
      });
    }

    renderCityList();
    initMap();
  </script>
</body>
</html>
