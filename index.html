<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>城市路书</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #0d1311;
      --ink: #f3eadc;
      --muted: #9aafaa;
      --gold: #efc27a;
      --paper: rgba(246, 239, 226, 0.94);
      --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
      --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 58%, #1a2c27 0%, #0d1311 58%);
      overflow: hidden;
    }
    .brand {
      position: absolute;
      z-index: 20;
      top: 5.5vh;
      left: 50%;
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 700;
      letter-spacing: 0.42em;
      padding-right: 0.42em;
      white-space: nowrap;
      color: var(--ink);
      animation: floaty 4.6s ease-in-out infinite;
      text-shadow:
        0 10px 28px rgba(0, 0, 0, 0.35),
        0 0 34px rgba(239, 194, 122, 0.16);
      pointer-events: none;
    }
    @keyframes floaty {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -9px); }
    }
    .stage {
      position: absolute;
      left: 50%;
      top: 54%;
      transform: translate(-50%, -50%);
      width: min(860px, 92vw);
      height: min(620px, 72vh);
      z-index: 1;
    }
    #map {
      width: 100%;
      height: 100%;
      background: transparent;
    }
    .leaflet-container {
      background: transparent !important;
      font-family: var(--sans);
      cursor: default;
    }
    .leaflet-interactive { cursor: pointer; }
    .leaflet-overlay-pane {
      filter: drop-shadow(0 22px 36px rgba(0, 0, 0, 0.32));
    }
    .fly {
      position: absolute;
      z-index: 30;
      min-width: 196px;
      max-width: 240px;
      padding: 14px 16px 12px;
      border-radius: 14px;
      background: var(--paper);
      color: #1c2421;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.32);
      display: none;
      animation: rise 0.22s ease;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fly .prov {
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: 0.16em;
      color: #6b746e;
    }
    .fly a {
      display: block;
      color: #1c2421;
      text-decoration: none;
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 6px 0;
      border-top: 1px solid rgba(28, 36, 33, 0.08);
    }
    .fly a:hover { color: #8a5a24; }
    .fly .wait {
      margin: 0;
      padding: 6px 0 2px;
      border-top: 1px solid rgba(28, 36, 33, 0.08);
      color: #6b746e;
      font-size: 15px;
      letter-spacing: 0.12em;
    }
    .fail {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      z-index: 40;
      color: var(--muted);
    }
    .fail a { color: var(--gold); }
    @media (max-width: 640px) {
      .brand { top: 4vh; letter-spacing: 0.28em; padding-right: 0.28em; }
      .stage { width: 96vw; height: 68vh; top: 56%; }
    }
  </style>
</head>
<body>
  <h1 class="brand">城市路书</h1>
  <div class="stage">
    <div id="map" role="application" aria-label="中国省份地图"></div>
    <div class="fly" id="fly" hidden></div>
  </div>
  <div class="fail" id="fail">地图加载失败，仍可 <a href="kunming.html">进入昆明路书</a></div>

  <script>
    const GUIDES = [
      { adcode: 530000, city: "昆明", dates: "20260827-0829", href: "kunming.html" }
    ];

    const CHINA_VIEW = [[18.15, 73.5], [53.55, 135.05]];

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/"/g, "&quot;");
    }

    function guidesFor(adcode) {
      const code = Number(adcode);
      return GUIDES.filter((g) => g.adcode === code);
    }

    function baseStyle() {
      return {
        color: "rgba(243, 234, 220, 0.58)",
        weight: 0.9,
        fillColor: "#d8ece4",
        fillOpacity: 0.2
      };
    }

    function activeStyle(hasGuides) {
      return hasGuides ? {
        color: "#f6ead0",
        weight: 1.8,
        fillColor: "#e2c48a",
        fillOpacity: 0.88
      } : {
        color: "rgba(243, 234, 220, 0.9)",
        weight: 1.5,
        fillColor: "#f3eadc",
        fillOpacity: 0.28
      };
    }

    async function init() {
      const mapEl = document.getElementById("map");
      const fly = document.getElementById("fly");
      const map = L.map(mapEl, {
        zoomControl: false,
        attributionControl: false,
        dragging: false,
        scrollWheelZoom: false,
        doubleClickZoom: false,
        boxZoom: false,
        keyboard: false,
        zoomSnap: 0.1
      });
      map.fitBounds(CHINA_VIEW, { padding: [12, 12], maxZoom: 6 });

      let selected = null;

      function hideFly() {
        fly.hidden = true;
        fly.style.display = "none";
        if (selected) {
          selected.setStyle(baseStyle());
          selected = null;
        }
      }

      function placeFly(layer) {
        const pt = map.latLngToContainerPoint(layer.getBounds().getCenter());
        const w = fly.offsetWidth || 200;
        const h = fly.offsetHeight || 90;
        const maxX = mapEl.clientWidth - w - 8;
        const maxY = mapEl.clientHeight - h - 8;
        fly.style.left = Math.max(8, Math.min(pt.x + 16, maxX)) + "px";
        fly.style.top = Math.max(8, Math.min(pt.y - 18, maxY)) + "px";
      }

      function openProvince(layer, feature) {
        const guides = guidesFor(feature.properties.adcode);
        if (selected && selected !== layer) selected.setStyle(baseStyle());
        selected = layer;
        layer.setStyle(activeStyle(guides.length > 0));
        layer.bringToFront();

        const name = feature.properties.name || "";
        if (guides.length) {
          fly.innerHTML = `<p class="prov">${escapeHtml(name)}</p>` + guides.map((g) =>
            `<a href="${escapeHtml(g.href)}">${escapeHtml(g.city)}｜${escapeHtml(g.dates)}</a>`
          ).join("");
        } else {
          fly.innerHTML = `<p class="prov">${escapeHtml(name)}</p><p class="wait">期待解锁</p>`;
        }
        fly.hidden = false;
        fly.style.display = "block";
        placeFly(layer);
      }

      try {
        const res = await fetch("china.json");
        if (!res.ok) throw new Error("geojson " + res.status);
        const geo = await res.json();
        const layer = L.geoJSON(geo, {
          style: baseStyle,
          onEachFeature: (feature, province) => {
            province.on("click", (e) => {
              L.DomEvent.stopPropagation(e);
              openProvince(province, feature);
            });
          }
        }).addTo(map);

        map.fitBounds(layer.getBounds(), { padding: [18, 18] });
        map.on("click", hideFly);
        requestAnimationFrame(() => map.invalidateSize());
      } catch (err) {
        document.getElementById("fail").style.display = "grid";
      }
    }

    init();
  </script>
</body>
</html>
