<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>城市路书</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #f3f0e8;
      --ink: #1c2421;
      --muted: #5c6b64;
      --line: #d9d2c4;
      --card: #fffcf6;
      --accent: #0f6b5c;
      --warm: #c45c26;
      --sage: #5e8a79;
      --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
      --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 8% -10%, #e7f3ef 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #f7e8dc 0%, transparent 50%),
        var(--bg);
    }
    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 36px 28px 56px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 28px;
    }
    .mark {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.28em;
    }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(36px, 5vw, 56px);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.1;
    }
    .count {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.08em;
      padding-bottom: 8px;
    }
    .hero {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 40px;
      align-items: center;
    }
    .atlas {
      position: relative;
      height: min(640px, 68vh);
    }
    #map {
      width: 100%;
      height: 100%;
      background: transparent;
    }
    .leaflet-container {
      background: transparent !important;
      font-family: var(--sans);
      cursor: default;
    }
    .leaflet-interactive { cursor: pointer; }
    .leaflet-overlay-pane {
      filter: drop-shadow(0 18px 28px rgba(28, 36, 33, 0.12));
    }
    .index {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 26px 22px;
      box-shadow: 0 10px 30px rgba(28, 36, 33, 0.06);
    }
    .index-kicker {
      margin: 0 0 18px;
      font-size: 12px;
      letter-spacing: 0.22em;
      color: var(--muted);
    }
    .index-item {
      display: block;
      text-decoration: none;
      color: inherit;
      padding: 14px 0;
      border-top: 1px solid var(--line);
    }
    .index-item:first-of-type { border-top: 0; padding-top: 0; }
    .index-city {
      display: block;
      font-family: var(--serif);
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    .index-meta {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }
    .index-go {
      display: inline-block;
      margin-top: 14px;
      color: var(--warm);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .fly {
      position: absolute;
      z-index: 30;
      min-width: 180px;
      padding: 12px 14px 10px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 12px 28px rgba(28, 36, 33, 0.12);
      display: none;
    }
    .fly .prov {
      margin: 0 0 6px;
      font-size: 12px;
      letter-spacing: 0.14em;
      color: var(--muted);
    }
    .fly a {
      color: var(--ink);
      text-decoration: none;
      font-family: var(--serif);
      font-weight: 700;
    }
    .fly .wait { margin: 0; color: var(--muted); }
    .fail {
      display: none;
      margin-top: 20px;
      color: var(--muted);
    }
    .fail a { color: var(--accent); }
    @media (max-width: 800px) {
      .page { padding: 22px 16px calc(28px + env(safe-area-inset-bottom)); }
      header { align-items: flex-start; margin-bottom: 12px; }
      h1 { font-size: 34px; letter-spacing: 0.06em; }
      .count { padding-bottom: 0; }
      .hero {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .atlas { height: 46vh; min-height: 280px; }
      .index { padding: 20px 18px 16px; }
      .index-city { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <p class="mark">FIELD NOTES</p>
        <h1>城市路书</h1>
      </div>
      <div class="count" id="guideCount"></div>
    </header>
    <div class="hero">
      <div class="atlas">
        <div id="map" role="img" aria-label="中国地图"></div>
        <div class="fly" id="fly" hidden></div>
      </div>
      <aside class="index" aria-label="已收录路书">
        <p class="index-kicker">目录</p>
        <div id="dockList"></div>
      </aside>
    </div>
    <p class="fail" id="fail">地图加载失败，仍可从目录进入昆明路书</p>
  </div>

  <script>
    const GUIDES = [
      { adcode: 530000, city: "昆明", region: "云南", dates: "2026.8.27～8.30", href: "kunming.html" }
    ];

    const CHINA_VIEW = [[18.15, 73.5], [53.55, 135.05]];

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/"/g, "&quot;");
    }

    function guidesFor(adcode) {
      return GUIDES.filter((g) => g.adcode === Number(adcode));
    }

    function renderIndex() {
      document.getElementById("guideCount").textContent = "已收录 " + GUIDES.length + " 城";
      document.getElementById("dockList").innerHTML = GUIDES.map((g) => `
        <a class="index-item" href="${escapeHtml(g.href)}">
          <span class="index-city">${escapeHtml(g.city)}</span>
          <span class="index-meta">${escapeHtml(g.region)} · ${escapeHtml(g.dates)}</span>
          <span class="index-go">进入路书 →</span>
        </a>
      `).join("");
    }

    function baseStyle(feature) {
      const live = guidesFor(feature.properties.adcode).length > 0;
      return live ? {
        color: "#f3f0e8",
        weight: 1.2,
        fillColor: "#c45c26",
        fillOpacity: 0.92
      } : {
        color: "#f3f0e8",
        weight: 1,
        fillColor: "#5e8a79",
        fillOpacity: 0.88
      };
    }

    function activeStyle(hasGuides) {
      return hasGuides ? {
        color: "#fff8ef",
        weight: 1.8,
        fillColor: "#a64b1d",
        fillOpacity: 1
      } : {
        color: "#fff8ef",
        weight: 1.5,
        fillColor: "#3f6b5c",
        fillOpacity: 1
      };
    }

    async function init() {
      renderIndex();
      const mapEl = document.getElementById("map");
      const fly = document.getElementById("fly");
      const map = L.map(mapEl, {
        zoomControl: false,
        attributionControl: false,
        dragging: false,
        scrollWheelZoom: false,
        doubleClickZoom: false,
        boxZoom: false,
        keyboard: false,
        zoomSnap: 0.1
      });
      map.fitBounds(CHINA_VIEW, { padding: [8, 8], maxZoom: 6 });

      let selected = null;

      function hideFly() {
        fly.hidden = true;
        fly.style.display = "none";
        if (selected) {
          selected.setStyle(baseStyle(selected.feature));
          selected = null;
        }
      }

      function placeFly(layer) {
        const pt = map.latLngToContainerPoint(layer.getBounds().getCenter());
        const w = fly.offsetWidth || 180;
        const h = fly.offsetHeight || 80;
        fly.style.left = Math.max(8, Math.min(pt.x + 14, mapEl.clientWidth - w - 8)) + "px";
        fly.style.top = Math.max(8, Math.min(pt.y - 12, mapEl.clientHeight - h - 8)) + "px";
      }

      function openProvince(layer, feature) {
        const guides = guidesFor(feature.properties.adcode);
        if (selected && selected !== layer) selected.setStyle(baseStyle(selected.feature));
        selected = layer;
        layer.setStyle(activeStyle(guides.length > 0));
        layer.bringToFront();
        const name = feature.properties.name || "";
        fly.innerHTML = guides.length
          ? `<p class="prov">${escapeHtml(name)}</p>` + guides.map((g) =>
              `<a href="${escapeHtml(g.href)}">${escapeHtml(g.city)}｜${escapeHtml(g.dates)}</a>`
            ).join("")
          : `<p class="prov">${escapeHtml(name)}</p><p class="wait">期待解锁</p>`;
        fly.hidden = false;
        fly.style.display = "block";
        placeFly(layer);
      }

      try {
        const res = await fetch("china.json");
        if (!res.ok) throw new Error("geojson " + res.status);
        const geo = await res.json();
        const layer = L.geoJSON(geo, {
          style: baseStyle,
          onEachFeature: (feature, province) => {
            province.feature = feature;
            province.on("mouseover", () => {
              if (selected === province) return;
              province.setStyle({ fillOpacity: 1 });
            });
            province.on("mouseout", () => {
              if (selected === province) return;
              province.setStyle(baseStyle(feature));
            });
            province.on("click", (e) => {
              L.DomEvent.stopPropagation(e);
              openProvince(province, feature);
            });
          }
        }).addTo(map);
        map.fitBounds(layer.getBounds(), { padding: [12, 12] });
        map.on("click", hideFly);
        requestAnimationFrame(() => map.invalidateSize());
      } catch (err) {
        document.getElementById("fail").style.display = "block";
      }
    }

    init();
  </script>
</body>
</html>
